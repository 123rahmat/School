name = "school-ms"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/files/*"]

[[durable_objects.bindings]]
name = "SCHOOL"
class_name = "SchoolDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SchoolDO"]

[[d1_databases]]
binding = "DB"
database_name = "school-platform"
database_id = "2b6b292f-7b3e-4dc8-9db1-e570dba27d22"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "school-files"

[triggers]
crons = ["5 * * * *"]

[vars]
OWNER_EMAIL = "owner@example.com"
# "1" shows sign-in codes on screen. Set to "0" in production and configure an email/SMS provider.
DEV_OTP = "1"
PAYMENT_ACCOUNTS = "Easypaisa 0300-0000000 / JazzCash 0300-0000000"
