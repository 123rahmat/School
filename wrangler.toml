name = "school"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/files/*"]

[[durable_objects.bindings]]
name = "SCHOOL"
class_name = "SchoolDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SchoolDO"]

[[durable_objects.bindings]]
name = "PLATFORM"
class_name = "PlatformDO"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PlatformDO"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "school-files"

[triggers]
crons = ["5 * * * *"]

[vars]
GOOGLE_CLIENT_ID = "705601663817-i9vpppf9dr8emr41ebu6due0nl68aijh.apps.googleusercontent.com"
OWNER_EMAIL = "Rahmatsps098@gmail.com"
PAYMENT_ACCOUNTS = ""

[observability.logs]
enabled = false
invocation_logs = true
