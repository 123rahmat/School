name: Verify School Worker

on:
  push:
    branches:
      - claude/hopeful-thompson-d11tl8
  pull_request:
    branches:
      - claude/hopeful-thompson-d11tl8
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: school-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, sanity tests and Cloudflare build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Clean dependency install
        run: npm ci
      - name: Run verification suite
        run: npm run check
