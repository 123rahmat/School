<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Institution Manager | Education management in one workspace</title>
<meta name="description" content="Institution Manager private application sign-in. Open your school workspace using your registered Google account.">\n<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="Institution Manager | Education management in one workspace">
<meta property="og:description" content="A private, role-based workspace for schools, colleges, universities, academies and training organisations.">
<meta property="og:type" content="website">\n<meta name="twitter:card" content="summary">\n<meta name="twitter:title" content="Institution Manager">\n<meta name="twitter:description" content="Sign in to your private education institution workspace.">
<meta name="theme-color" content="#0B1426">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <main class="boot-screen" role="status" aria-live="polite" aria-label="Checking your secure sign-in">
    <div class="boot-logo-stage">
      <span class="boot-orbit boot-orbit-one"></span>
      <span class="boot-orbit boot-orbit-two"></span>
      <span class="boot-logo-glow"></span>
      <img class="boot-logo" src="/icon.svg" alt="Institution Manager">
    </div>
    <div class="boot-brand">Institution Manager</div>
    <div class="boot-progress" aria-hidden="true"><span></span></div>
    <p class="boot-message">Checking your secure sign-in…</p>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-box" id="modal-box"></div></div>
<script src="/app.js" type="module"></script>
</body>
</html>
